<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume.io — 智能简历制作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --app-bg:#e8e4de;--editor-bg:#1a1816;--surface:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.08);--text:#e8e4de;--muted:#9c9590;
  --accent:#c2855a;--accent-dim:rgba(194,133,90,0.15);--nav-bg:#141210;
  --nav-h:60px;--panel-w:430px;--radius:10px;
  --font-ui:'DM Sans','Noto Sans SC',system-ui,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-ui);background:var(--app-bg);color:var(--text)}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}

.top-nav{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-h);background:var(--nav-bg);
  display:flex;align-items:center;padding:0 24px;border-bottom:1px solid rgba(255,255,255,0.06)}
.nav-brand{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--accent);
  letter-spacing:-0.02em;flex-shrink:0;margin-right:36px}
.nav-brand span{color:#e8e4de;font-weight:400}
.template-switcher{display:flex;gap:4px;flex:1;justify-content:center;overflow-x:auto}
.tmpl-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;
  font-size:12px;font-weight:500;color:var(--muted);transition:all .2s;white-space:nowrap}
.tmpl-btn:hover{color:var(--text);background:rgba(255,255,255,0.06)}
.tmpl-btn.active{color:var(--accent);background:var(--accent-dim)}
.tmpl-swatch{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.nav-actions{display:flex;gap:10px;flex-shrink:0;margin-left:24px}
.nav-btn{display:flex;align-items:center;gap:7px;padding:9px 18px;border-radius:8px;
  font-size:13px;font-weight:500;transition:all .2s}
.nav-btn svg{width:15px;height:15px}
.nav-btn-share{color:var(--muted);background:rgba(255,255,255,0.06)}
.nav-btn-share:hover{color:var(--text);background:rgba(255,255,255,0.12)}
.nav-btn-dl{color:#1a1816;background:var(--accent);font-weight:600}
.nav-btn-dl:hover{filter:brightness(1.1)}

.app-main{display:flex;height:100vh;padding-top:var(--nav-h);overflow:hidden;opacity:0;animation:fadeIn .5s ease .15s forwards}
@keyframes fadeIn{to{opacity:1}}

.editor-panel{width:var(--panel-w);flex-shrink:0;background:var(--editor-bg);
  overflow-y:auto;overflow-x:hidden;padding:16px 14px;display:flex;flex-direction:column;gap:6px;
  border-right:1px solid rgba(255,255,255,0.04);min-height:0}

.panel{border-radius:var(--radius);overflow:visible}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
  cursor:pointer;border-radius:var(--radius);transition:background .15s;user-select:none}
.panel-header:hover{background:rgba(255,255,255,0.04)}
.panel-title{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.panel-icon{width:18px;height:18px;opacity:.55;display:flex}
.panel-icon svg{width:100%;height:100%}
.panel-chevron{width:18px;height:18px;transition:transform .25s ease;color:var(--muted);display:flex}
.panel-chevron svg{width:100%;height:100%}
.panel.collapsed .panel-chevron{transform:rotate(-90deg)}
.panel-body{overflow:hidden;transition:opacity .25s ease;opacity:1}
.panel.collapsed .panel-body{display:none}
.panel-body-content{padding:2px 14px 14px}

.form-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.form-group{display:flex;flex-direction:column;gap:3px;flex:1 1 140px;min-width:0}
.form-group.full{flex:1 0 100%}
.form-group label{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.f-input{background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:9px 12px;border-radius:8px;font-size:13px;transition:border-color .2s,background .2s;width:100%}
.f-input:focus{outline:none;border-color:var(--accent);background:rgba(255,255,255,0.08)}
.f-input::placeholder{color:rgba(255,255,255,0.2)}
textarea.f-input{resize:vertical;min-height:68px;line-height:1.55}

.entry-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.entry-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.entry-num{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-dim);
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.entry-del{width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;color:var(--muted);transition:all .15s}
.entry-del:hover{background:rgba(220,38,38,0.15);color:#f87171}
.entry-del svg{width:14px;height:14px}
.add-btn{width:100%;padding:10px;border:1px dashed rgba(255,255,255,0.12);border-radius:8px;
  color:var(--muted);font-size:13px;transition:all .2s;margin-top:2px}
.add-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}

.skill-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.skill-tag{display:flex;align-items:center;gap:5px;padding:5px 10px;background:var(--accent-dim);
  color:var(--accent);border-radius:6px;font-size:12px;font-weight:500}
.skill-tag button{display:flex;color:var(--accent);opacity:.6;transition:opacity .15s}
.skill-tag button:hover{opacity:1}
.skill-tag button svg{width:12px;height:12px}

/* ── PHOTO UPLOAD (editor) ── */
.photo-row{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:12px;
  background:var(--surface);border:1px dashed var(--border);border-radius:10px;cursor:pointer;transition:all .2s}
.photo-row:hover{border-color:var(--accent);background:rgba(255,255,255,0.06)}
.photo-avatar{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.06);
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.photo-avatar img{width:100%;height:100%;object-fit:cover}
.photo-avatar svg{width:22px;height:22px;opacity:.3}
.photo-text{flex:1}.photo-label{font-size:13px;font-weight:500}
.photo-hint{font-size:11px;color:var(--muted);margin-top:2px}
.photo-del{width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;color:var(--muted);transition:all .15s;flex-shrink:0}
.photo-del:hover{background:rgba(220,38,38,0.15);color:#f87171}
.photo-del svg{width:14px;height:14px}

.preview-panel{flex:1;overflow-y:auto;display:flex;justify-content:center;padding:32px;min-width:0;
  background-image:radial-gradient(ellipse at 30% 20%,rgba(194,133,90,0.06) 0%,transparent 50%),
    radial-gradient(ellipse at 70% 80%,rgba(0,0,0,0.03) 0%,transparent 50%)}
.preview-box{width:100%;max-width:680px;flex-shrink:0}
.a4-paper{background:#fff;width:100%;min-height:880px;border-radius:2px;
  box-shadow:0 1px 4px rgba(0,0,0,0.03),0 4px 16px rgba(0,0,0,0.06),
    0 16px 48px rgba(0,0,0,0.06),0 32px 80px rgba(0,0,0,0.04);
  padding:48px 44px;position:relative;overflow:visible}

.rc{--r-accent:#292524;--r-text:#1c1917;--r-light:#57534e;--r-border:#d6d3d1;
  --r-nf:'Playfair Display','Noto Serif SC',serif;
  --r-bf:'Crimson Pro','Noto Serif SC',serif;
  --r-sf:'DM Sans','Noto Sans SC',sans-serif;
  --r-ns:28px;--r-ts:14px;--r-ss:13px;--r-bs:12.5px;--r-lh:1.6;--r-gap:20px;
  --r-ha:left;--r-stw:700;--r-stt:none;--r-stb:2px solid var(--r-accent);
  --r-stp:0 0 4px 0;--r-skb:#f5f5f4;--r-skc:var(--r-accent)}
.r-hd{margin-bottom:var(--r-gap)}
.r-nm{font-family:var(--r-nf);font-size:var(--r-ns);font-weight:700;color:var(--r-accent);
  line-height:1.2;letter-spacing:-0.01em}
.r-tt{font-family:var(--r-sf);font-size:var(--r-ts);color:var(--r-light);margin-top:4px}
.r-ct{margin-top:10px;display:flex;flex-wrap:wrap;gap:0;font-family:var(--r-sf);
  font-size:11.5px;color:var(--r-light)}
.r-ci{white-space:nowrap}
.r-cs{margin:0 6px;color:var(--r-border);user-select:none}
.r-sec{margin-bottom:var(--r-gap)}
.r-st{font-family:var(--r-sf);font-size:var(--r-ss);font-weight:var(--r-stw);color:var(--r-accent);
  text-transform:var(--r-stt);letter-spacing:.06em;border-bottom:var(--r-stb);
  padding:var(--r-stp);margin-bottom:10px}
.r-sm{font-family:var(--r-bf);font-size:var(--r-bs);line-height:var(--r-lh);color:var(--r-text)}
.r-en{margin-bottom:12px}.r-en:last-child{margin-bottom:0}
.r-eh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.r-el{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.r-et{font-family:var(--r-sf);font-size:13px;font-weight:600;color:var(--r-text)}
.r-eo{font-family:var(--r-sf);font-size:12px;color:var(--r-light)}
.r-ed{font-family:var(--r-sf);font-size:11px;color:var(--r-light);white-space:nowrap;flex-shrink:0}
.r-dp{font-family:var(--r-bf);font-size:var(--r-bs);line-height:var(--r-lh);
  color:var(--r-text);margin-top:4px;white-space:pre-line}
.r-sw{display:flex;flex-wrap:wrap;gap:6px}
.r-sk{font-family:var(--r-sf);font-size:11px;padding:4px 12px;border-radius:3px;
  background:var(--r-skb);color:var(--r-skc);font-weight:500}
.r-hl{animation:rHL 1.5s ease}
@keyframes rHL{0%{background:rgba(194,133,90,0.15)}100%{background:transparent}}

/* ── PHOTO IN RESUME ── */
.r-hd.r-has-photo{display:flex;justify-content:space-between;align-items:flex-start}
.r-hd.r-has-photo .r-hd-main{flex:1;min-width:0}
.r-hd-photo{width:86px;height:108px;flex-shrink:0;overflow:hidden;margin-left:16px;border-radius:6px}
.r-hd-photo img{width:100%;height:100%;object-fit:cover;display:block}

.rc[data-t="classic"] .r-hd-photo{border:1px solid var(--r-border)}
.rc[data-t="executive"]{--r-accent:#1e3a5f;--r-text:#1a1a2e;--r-light:#4a5568;--r-border:#bee3f8;
  --r-stb:2px solid #1e3a5f;--r-stp:0 0 5px 0;--r-skb:#ebf4ff;--r-skc:#1e3a5f}
.rc[data-t="executive"] .r-ed{color:#3182ce}
.rc[data-t="executive"] .r-hd-photo{border:2px solid #93c5fd;border-radius:6px}
.rc[data-t="creative"]{--r-accent:#d4604e;--r-text:#2d2d2d;--r-light:#6b7280;--r-border:#e5e7eb;
  --r-nf:'Syne','Noto Sans SC',sans-serif;--r-bf:'DM Sans','Noto Sans SC',sans-serif;
  --r-sf:'DM Sans','Noto Sans SC',sans-serif;
  --r-stb:2px solid #d4604e;--r-stp:0 0 4px 0;--r-skb:rgba(212,96,78,0.1);--r-skc:#d4604e;
  --r-ha:left;display:grid;grid-template-columns:185px 1fr;padding:0!important;margin:0;gap:0}
.rc[data-t="creative"] .r-hd{grid-column:1;grid-row:1/-1;background:linear-gradient(170deg,#d4604e,#3d405b);
  color:#fff;padding:36px 22px!important;text-align:left;margin:0;align-self:stretch}
.rc[data-t="creative"] .r-hd.r-has-photo{flex-direction:column;align-items:center}
.rc[data-t="creative"] .r-hd.r-has-photo .r-hd-main{text-align:center}
.rc[data-t="creative"] .r-hd.r-has-photo .r-ct{justify-content:center}
.rc[data-t="creative"] .r-hd-photo{order:-1;margin:0 0 14px;width:80px;height:80px;
  border-radius:50%;border:3px solid rgba(255,255,255,0.3)}
.rc[data-t="creative"] .r-nm{color:#fff;font-size:23px}
.rc[data-t="creative"] .r-tt{color:rgba(255,255,255,0.8);font-size:12px}
.rc[data-t="creative"] .r-ct{color:rgba(255,255,255,0.7);flex-direction:column;gap:5px;margin-top:16px}
.rc[data-t="creative"] .r-cs{display:none}
.rc[data-t="creative"] .r-sec{grid-column:2;padding:14px 28px 0 22px}
.rc[data-t="creative"] .r-sec:first-of-type{padding-top:30px}
.rc[data-t="creative"] .r-sk{border-radius:20px}
.rc[data-t="academic"]{--r-accent:#3c3632;--r-text:#1a1816;--r-light:#6b6460;--r-border:#c7c3be;
  --r-nf:'Noto Serif SC',serif;--r-bf:'Noto Serif SC','Crimson Pro',serif;
  --r-sf:'Noto Serif SC',serif;--r-ns:26px;--r-ss:13px;--r-bs:12px;--r-lh:1.7;
  --r-stw:600;--r-stb:1px solid #3c3632;--r-stp:0 0 4px 0;--r-skb:transparent;--r-skc:#3c3632}
.rc[data-t="academic"] .r-hd-photo{border:1px solid var(--r-border)}
.rc[data-t="academic"] .r-sk{border:1px solid var(--r-border);border-radius:0}
.rc[data-t="academic"] .r-et{font-family:'Noto Serif SC',serif}
.rc[data-t="modern"]{--r-accent:#6d28d9;--r-text:#1f2937;--r-light:#6b7280;--r-border:#e5e7eb;
  --r-nf:'DM Sans','Noto Sans SC',sans-serif;--r-bf:'DM Sans','Noto Sans SC',sans-serif;
  --r-sf:'DM Sans','Noto Sans SC',sans-serif;
  --r-ns:30px;--r-stt:uppercase;--r-stb:3px solid #6d28d9;--r-stp:0 0 5px 0;
  --r-skb:rgba(109,40,217,0.08);--r-skc:#6d28d9}
.rc[data-t="modern"] .r-nm{letter-spacing:-0.02em}
.rc[data-t="modern"] .r-hd-photo{border:2px solid #c4b5fd;border-radius:8px}
.rc[data-t="modern"] .r-sk{border-radius:20px}
.rc[data-t="bold"]{--r-accent:#dc2626;--r-text:#18181b;--r-light:#52525b;--r-border:#e4e4e7;
  --r-nf:'Syne','Noto Sans SC',sans-serif;--r-bf:'DM Sans','Noto Sans SC',sans-serif;
  --r-sf:'DM Sans','Noto Sans SC',sans-serif;
  --r-ns:34px;--r-stt:uppercase;--r-stb:none;--r-stp:6px 12px;--r-skb:#dc2626;--r-skc:#fff}
.rc[data-t="bold"] .r-nm{background:#dc2626;color:#fff;display:inline-block;padding:4px 14px;font-size:30px}
.rc[data-t="bold"] .r-st{background:#18181b;color:#fff;display:inline-block;border-radius:3px;
  font-size:11px;letter-spacing:.1em}
.rc[data-t="bold"] .r-hd-photo{border:3px solid #dc2626;border-radius:4px}
.rc[data-t="bold"] .r-sk{border-radius:4px;font-weight:600}

.toast{position:fixed;bottom:32px;left:50%;z-index:200;transform:translateX(-50%) translateY(80px);
  background:var(--nav-bg);color:var(--text);padding:12px 28px;border-radius:10px;
  font-size:14px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,0.25);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

@media print{
  .top-nav,.editor-panel,.toast{display:none!important}
  .app-main{display:block!important;padding:0!important;height:auto!important}
  .preview-panel{padding:0!important;overflow:visible!important;display:block!important}
  .a4-paper{box-shadow:none!important;border-radius:0!important;min-height:auto!important;padding:36px 40px!important}
  .rc[data-t="creative"]{display:grid!important}
}
</style>
</head>
<body>
<nav class="top-nav">
  <div class="nav-brand">Resume<span>.io</span></div>
  <div class="template-switcher" id="tmplBar"></div>
  <div class="nav-actions">
    <button class="nav-btn nav-btn-share" onclick="shareLink()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>

    <button class="nav-btn nav-btn-dl" onclick="downloadPDF()">

      下载 PDF</button>
  </div>
</nav>
<main class="app-main">
  <aside class="editor-panel" id="editor"></aside>
  <section class="preview-panel"><div class="preview-box"><div class="a4-paper"><div class="rc" id="rc" data-t="classic"></div></div></div></section>
</main>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>

  template:'classic'
};
const S=JSON.parse(JSON.stringify(DEMO));
const SEC_LBL={experience:'工作经历',education:'教育背景',projects:'项目经历'};
const SEC_FLD={
  experience:[
    {k:'company',l:'公司名称',p:'如：字节跳动'},{k:'position',l:'职位',p:'如：高级前端工程师'},
    {k:'startDate',l:'开始时间',p:'2021-03'},{k:'endDate',l:'结束时间',p:'至今'},
    {k:'description',l:'工作描述',p:'描述职责与成就',t:'textarea',full:1}
  ],
  education:[
    {k:'institution',l:'学校名称',p:'如：北京大学'},{k:'degree',l:'学位专业',p:'如：计算机 · 硕士'},
    {k:'startDate',l:'开始时间',p:'2016-09'},{k:'endDate',l:'结束时间',p:'2018-06'},
    {k:'description',l:'补充说明',p:'GPA、荣誉等（选填）',t:'textarea',full:1}
  ],
  projects:[
    {k:'name',l:'项目名称',p:'如：设计系统'},{k:'technologies',l:'技术栈',p:'React, TypeScript...',full:1},
    {k:'description',l:'项目描述',p:'项目内容与贡献',t:'textarea',full:1}
  ]
};
const IC={
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  brief:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>',
  cap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10l-10-5L2 10l10 5 10-5z"/><path d="M6 12v5c0 2 3 3 6 3s6-1 6-3v-5"/></svg>',
  tool:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>',
  layer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>'
};
const PNLS=[
  {id:'personal',t:'个人信息',ic:'user'},{id:'summary',t:'个人简介',ic:'file'},
  {id:'experience',t:'工作经历',ic:'brief'},{id:'education',t:'教育背景',ic:'cap'},
  {id:'skills',t:'专业技能',ic:'tool'},{id:'projects',t:'项目经历',ic:'layer'}
];
function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500)}
function $(id){return document.getElementById(id)}

/* ═══ INIT ═══ */
document.addEventListener('DOMContentLoaded',()=>{loadHash();buildTmplBar();buildEditor();renderPreview()});
function loadHash(){
  const h=location.hash.slice(1);if(!h)return;
  try{const d=JSON.parse(decodeURIComponent(escape(atob(h))));if(d&&d.personal)Object.assign(S,d);S.photo=d.photo||null}catch(e){}
}

/* ═══ TEMPLATES ═══ */
function buildTmplBar(){
  $('tmplBar').innerHTML=TMPLS.map(t=>
    `<button class="tmpl-btn${S.template===t.id?' active':''}" data-t="${t.id}" onclick="switchTmpl('${t.id}')">
      <span class="tmpl-swatch" style="background:${t.sw}"></span>${t.name}</button>`).join('');
}
function switchTmpl(id){
  S.template=id;
  document.querySelectorAll('.tmpl-btn').forEach(b=>b.classList.toggle('active',b.dataset.t===id));
  $('rc').dataset.t=id;
}

/* ═══ EDITOR ═══ */
function buildEditor(){
  $('editor').innerHTML=PNLS.map(p=>`
    <div class="panel${p.id==='projects'?' collapsed':''}" id="pl-${p.id}">
      <div class="panel-header" onclick="toggleP('${p.id}')">
        <div class="panel-title"><span class="panel-icon">${IC[p.ic]}</span>${p.t}</div>
        <span class="panel-chevron">${IC.chev}</span>
      </div>
      <div class="panel-body"><div class="panel-body-content">${panelContent(p.id)}</div></div>
    </div>`).join('');
}
function panelContent(id){
  if(id==='personal') return personalFields();
  if(id==='summary') return summaryField();
  if(id==='skills') return skillsField();
  return repeatableFields(id);
}

function personalFields(){
  const p=S.personal;
  const f=(l,k,tp='text',ph='')=>`<div class="form-group"><label>${l}</label><input class="f-input" type="${tp}" value="${esc(p[k])}" placeholder="${ph}" oninput="updPers('${k}',this.value)"></div>`;
  return `<div class="photo-row" onclick="$('photoInput').click()">
    <div class="photo-avatar" id="photoAvatar">${S.photo?`<img src="${S.photo}">`:IC.camera}</div>
    <div class="photo-text"><div class="photo-label">${S.photo?'更换证件照':'添加证件照'}</div>
      <div class="photo-hint">点击上传 · JPG/PNG · ≤5MB</div></div>
    <button class="photo-del" id="photoDel" onclick="event.stopPropagation();removePhoto()" title="移除照片" style="display:${S.photo?'flex':'none'}">${IC.x}</button>
  </div>
  <input type="file" id="photoInput" accept="image/*" hidden onchange="handlePhoto(event)">
  <div class="form-row">${f('姓名','name','text','请输入姓名')}${f('职位头衔','title','text','如：高级前端工程师')}</div>
  <div class="form-row">${f('邮箱','email','email','name@example.com')}${f('电话','phone','tel','138-0000-0000')}</div>
  <div class="form-row">${f('所在城市','location','text','如：北京市')}${f('个人网站','website','text','github.com/...')}</div>`;
}
function summaryField(){
  return `<div class="form-row"><div class="form-group full"><textarea class="f-input" rows="4" placeholder="用2-3句话概述你的专业背景和核心优势" oninput="updPers('summary',this.value)">${esc(S.personal.summary)}</textarea></div></div>`;
}
function entryHTML(sec,en,i){
  const fields=SEC_FLD[sec];
  return `<div class="entry-card" data-idx="${i}">
    <div class="entry-top"><span class="entry-num">${i+1}</span>
      <button class="entry-del" onclick="rmEntry('${sec}',${i})" title="删除">${IC.x}</button></div>
    <div class="form-row">${fields.map(f=>{
      const v=esc(en[f.k]||''),cls=f.full?'form-group full':'form-group';
      const inp=f.t==='textarea'
        ?`<textarea class="f-input" rows="3" placeholder="${f.p||''}" oninput="updEntry('${sec}',${i},'${f.k}',this.value)">${v}</textarea>`
        :`<input class="f-input" value="${v}" placeholder="${f.p||''}" oninput="updEntry('${sec}',${i},'${f.k}',this.value)">`;
      return `<div class="${cls}"><label>${f.l}</label>${inp}</div>`;
    }).join('')}</div></div>`;
}
function repeatableFields(sec){
  return `<div id="${sec}-list">${S[sec].map((en,i)=>entryHTML(sec,en,i)).join('')}</div>
    <button class="add-btn" onclick="addEntry('${sec}')">+ 添加${SEC_LBL[sec]}</button>`;
}
function skillsField(){
  return `<div class="form-row"><div class="form-group full"><label>输入技能，按回车添加</label>
    <input class="f-input" id="skIn" placeholder="输入后按 Enter 添加" onkeydown="if(event.key==='Enter'){event.preventDefault();addSk(this.value);this.value='';}"></div></div>
    <div class="skill-tags" id="skTags">${S.skills.map((s,i)=>`<span class="skill-tag">${esc(s)}<button onclick="rmSk(${i})">${IC.x}</button></span>`).join('')}</div>`;
}

/* ═══ PHOTO ═══ */
function handlePhoto(e){
  const file=e.target.files[0];if(!file)return;
  if(file.size>5*1024*1024){toast('图片不能超过 5MB');return}
  if(!file.type.startsWith('image/')){toast('请选择图片文件');return}
  const reader=new FileReader();
  reader.onload=function(ev){S.photo=ev.target.result;refreshPhoto();renderPreview()};
  reader.readAsDataURL(file);
}
function removePhoto(){
  S.photo=null;refreshPhoto();renderPreview();
}
function refreshPhoto(){
  const av=$('photoAvatar');if(av)av.innerHTML=S.photo?`<img src="${S.photo}">`:IC.camera;
  const del=$('photoDel');if(del)del.style.display=S.photo?'flex':'none';
  const row=av?.closest('.photo-row');
  if(row){const lb=row.querySelector('.photo-label');if(lb)lb.textContent=S.photo?'更换证件照':'添加证件照'}
}

/* ═══ PANEL TOGGLE ═══ */
function toggleP(id){$('pl-'+id).classList.toggle('collapsed')}

/* ═══ STATE ═══ */
function updPers(k,v){S.personal[k]=v;renderPreview();hlSec('header')}
function updEntry(sec,i,k,v){S[sec][i][k]=v;renderPreview();hlSec(sec)}
function addEntry(sec){
  const t={};SEC_FLD[sec].forEach(f=>t[f.k]='');t.id=gid();S[sec].push(t);rebuildSec(sec);renderPreview();
}
function rmEntry(sec,i){S[sec].splice(i,1);rebuildSec(sec);renderPreview()}
function rebuildSec(sec){
  const el=$(sec+'-list');if(!el)return;
  el.innerHTML=S[sec].map((en,i)=>entryHTML(sec,en,i)).join('');
}
function addSk(v){v=v.trim();if(!v||S.skills.includes(v))return;S.skills.push(v);refreshSk();renderPreview();hlSec('skills')}
function rmSk(i){S.skills.splice(i,1);refreshSk();renderPreview();hlSec('skills')}
function refreshSk(){
  const el=$('skTags');if(!el)return;
  el.innerHTML=S.skills.map((s,i)=>`<span class="skill-tag">${esc(s)}<button onclick="rmSk(${i})">${IC.x}</button></span>`).join('');
}
function hlSec(sec){
  const map={header:'.r-hd',summary:'[data-s="summary"]',experience:'[data-s="experience"]',
    education:'[data-s="education"]',skills:'[data-s="skills"]',projects:'[data-s="projects"]'};
  const sel=map[sec];if(!sel)return;
  const el=document.querySelector('#rc '+sel);if(!el)return;
  el.classList.remove('r-hl');void el.offsetWidth;el.classList.add('r-hl');
}

/* ═══ PREVIEW ═══ */
function renderPreview(){
  const p=S.personal,ct=[p.email,p.phone,p.location,p.website].filter(Boolean);
  let h=`<header class="r-hd${S.photo?' r-has-photo':''}">
    ${S.photo?'<div class="r-hd-main">':''}
      <h1 class="r-nm">${esc(p.name)||'<span style="opacity:.3">你的姓名</span>'}</h1>
      ${p.title?`<p class="r-tt">${esc(p.title)}</p>`:''}
      ${ct.length?`<div class="r-ct">${ct.map(c=>`<span class="r-ci">${esc(c)}</span>`).join('<span class="r-cs">|</span>')}</div>`:''}
    ${S.photo?`</div><div class="r-hd-photo"><img src="${S.photo}" alt=""></div>`:''}
  </header>`;
  if(p.summary)h+=`<section class="r-sec" data-s="summary"><h2 class="r-st">个人简介</h2><p class="r-sm">${esc(p.summary)}</p></section>`;
  const exp=S.experience.filter(e=>e.company||e.position);
  if(exp.length)h+=`<section class="r-sec" data-s="experience"><h2 class="r-st">工作经历</h2>${exp.map(e=>`<div class="r-en"><div class="r-eh"><div class="r-el"><span class="r-et">${esc(e.position)}</span>${e.position&&e.company?'<span class="r-eo"> · </span>':''}<span class="r-eo">${esc(e.company)}</span></div><span class="r-ed">${esc(e.startDate||'')}${e.startDate&&e.endDate?' — ':''}${esc(e.endDate||'')}</span></div>${e.description?`<div class="r-dp">${esc(e.description)}</div>`:''}</div>`).join('')}</section>`;
  const edu=S.education.filter(e=>e.institution||e.degree);
  if(edu.length)h+=`<section class="r-sec" data-s="education"><h2 class="r-st">教育背景</h2>${edu.map(e=>`<div class="r-en"><div class="r-eh"><div class="r-el"><span class="r-et">${esc(e.institution)}</span>${e.institution&&e.degree?'<span class="r-eo"> · </span>':''}<span class="r-eo">${esc(e.degree)}</span></div><span class="r-ed">${esc(e.startDate||'')}${e.startDate&&e.endDate?' — ':''}${esc(e.endDate||'')}</span></div>${e.description?`<div class="r-dp">${esc(e.description)}</div>`:''}</div>`).join('')}</section>`;
  if(S.skills.length)h+=`<section class="r-sec" data-s="skills"><h2 class="r-st">专业技能</h2><div class="r-sw">${S.skills.map(s=>`<span class="r-sk">${esc(s)}</span>`).join('')}</div></section>`;
  const prj=S.projects.filter(p=>p.name);
  if(prj.length)h+=`<section class="r-sec" data-s="projects"><h2 class="r-st">项目经历</h2>${prj.map(p=>`<div class="r-en"><div class="r-eh"><span class="r-et">${esc(p.name)}</span>${p.technologies?`<span class="r-ed">${esc(p.technologies)}</span>`:''}</div>${p.description?`<div class="r-dp">${esc(p.description)}</div>`:''}</div>`).join('')}</section>`;
  $('rc').innerHTML=h;
}

/* ═══ PDF ═══ */
function downloadPDF(){
  if(typeof html2pdf==='undefined'){
    toast('PDF 库加载中，请稍后重试或按 Ctrl+P');
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    s.onload=()=>toast('加载完成，请再次点击下载');s.onerror=()=>toast('加载失败，请按 Ctrl+P');
    document.body.appendChild(s);return;
  }
  toast('正在生成 PDF...');const el=$('rc'),origT=el.dataset.t;let restore=false;
  if(origT==='creative'){restore=true;el.style.cssText='display:block;padding:44px;margin:0';
    el.querySelectorAll('.r-hd').forEach(h=>h.style.cssText='background:none;color:inherit;padding:0;margin:0 0 20px');
    el.querySelectorAll('.r-sec').forEach(s=>s.style.cssText='padding:0 0 4px')}
  html2pdf().set({margin:0,filename:(S.personal.name||'resume')+'_简历.pdf',
    image:{type:'jpeg',quality:0.98},html2canvas:{scale:2,useCORS:true,logging:false,allowTaint:true},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['avoid-all','css','legacy']}
  }).from(el).save().then(()=>{toast('PDF 已下载');if(restore)switchTmpl(origT)})
  .catch(err=>{console.error(err);toast('生成失败，请按 Ctrl+P');if(restore)switchTmpl(origT);setTimeout(()=>window.print(),800)});
}

/* ═══ SHARE ═══ */
function shareLink(){
  try{const url=location.origin+location.pathname+'#'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url).then(()=>toast('链接已复制'));
    else{const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('链接已复制')}
  }catch(e){toast('生成链接失败')}
}
</script>
</body>
